# Nginx snippet for Lightsail — long-cache static assets + HTTP/2 reminder
# Include inside the server { } block that serves sicher-bitcoin-verwahren.ch
#
# Example:
#   include /var/www/sicherverwahren/deploy/nginx-static-cache.conf;

# Prefer HTTP/2 on the SSL listen directive, e.g.:
#   listen 443 ssl http2;
#   listen [::]:443 ssl http2;

location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|ico|woff|woff2|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    try_files $uri =404;
}
